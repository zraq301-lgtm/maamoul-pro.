        name: "Nawh Final Recovery Build"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: 4. Build Web Project
        env:
          VITE_GITHUB_TOKEN: ${{ secrets.VITE_GITHUB_TOKEN }}
        run: |
          npm install --legacy-peer-deps
          npm run build
          # لا نحتاج لنسخ dist إلى www يدوياً إذا كان Capacitor مضبوطاً للعمل مع dist

      - name: 5. Sync Capacitor
        run: |
          # حذف المجلد القديم لضمان نظافة البناء
          rm -rf android
          # إضافة المنصة والمزامنة بعد اكتمال بناء الويب
          npx cap add android
          npx cap sync android

      - name: 6. Inject Identity & Firebase
        run: |
          mkdir -p android/app/
          echo '{"project_info": {"project_number": "162488255991", "project_id": "nawh-app"}, "client": [{"client_info": {"mobilesdk_app_id": "1:162488255991:android:73d6299f11a1b7aec61af2", "android_client_info": {"package_name": "com.nawh.app"}}, "api_key": [{"current_key": "AIzaSyAKjsgnoHnGGr3urhm6Kpu7RvxN2dp6sJQ"}], "services": {"appinvite_service": {"other_platform_oauth_client": []}}}]}' > android/app/google-services.json
          
          # ضبط المعرفات
          sed -i 's/namespace ".*"/namespace "com.nawh.app"/' android/app/build.gradle
          sed -i 's/applicationId ".*"/applicationId "com.nawh.app"/' android/app/build.gradle
          
          STRINGS="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">nawh.ai<\/string>/' $STRINGS
          fi

      - name: 6.5. Generate App Icons
        run: |
          npm install @capacitor/assets --save-dev
          mkdir -p assets
          cp resources/icon-foreground.png assets/icon.png || echo "No icon found"
          npx capacitor-assets generate --android

      - name: 7. Native Android Compilation
        working-directory: ./android
        run: |
          chmod +x gradlew
          # تنظيف الـ Gradle قبل البناء
          ./gradlew clean
          # إصلاح تعارض مكتبة bcprov
          echo "configurations.all { resolutionStrategy.eachDependency { details -> if (details.requested.name == 'bcprov-jdk18on') { details.useVersion '1.78.1' } } }" >> build.gradle
          # البناء
          ./gradlew assembleRelease bundleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m"

      - name: 8. Sign APK & AAB
        run: |
          keytool -genkey -v -keystore nawh.jks -alias nawh_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass "nawh_pass_2026" -keypass "nawh_pass_2026" -dname "CN=NawhApp, O=Nawh, C=EG" -noprompt
          
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "app-release-unsigned.apk" | head -n 1)
          AAB_PATH=$(find android/app/build/outputs/bundle/release/ -name "app-release.aab" | head -n 1)
          BUILD_TOOLS_VERSION=$(ls $ANDROID_HOME/build-tools | tail -n 1)
          
          $ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner sign --ks nawh.jks --ks-pass pass:"nawh_pass_2026" --out Nawh-Final.apk "$APK_PATH"
          jarsigner -keystore nawh.jks -storepass "nawh_pass_2026" -keypass "nawh_pass_2026" "$AAB_PATH" nawh_alias
          cp "$AAB_PATH" Nawh-Final.aab

      - name: 9. Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.${{ github.run_number }}
          name: "Nawh Stable Build v1.5.${{ github.run_number }}"
          files: |
            Nawh-Final.apk
            Nawh-Final.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
