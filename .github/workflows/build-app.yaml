name: "Zad Elkhair Production Build"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 4. Install ImageMagick System Dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: 5. Clean & Install Project Dependencies Strictly
        run: |
          # تنظيف كامل لضمان بناء مستقل 100% عن أي رواسب
          rm -rf node_modules package-lock.json android ios dist www build
          
          # تثبيت المكتبات بناءً على ملف package.json الخاص بك دون زيادة أو نقصان
          npm install --legacy-peer-deps
          
          # تشغيل أمر البناء الخاص بك والمحدد في الـ scripts لإنتاج مجلد dist
          npm run build

      - name: 6. Initialize Android (Fresh Start)
        run: |
          # إضافة منصة أندرويد خام ومزامنتها مع مجلد المخرجات dist
          npx cap add android
          npx cap sync android

      - name: 7. Inject Configurations & Firebase
        shell: bash
        run: |
          STRINGS="android/app/src/main/res/values/strings.xml"
          APP_GRADLE="android/app/build.gradle"
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          # أولاً: ضبط الهوية الرسمية للحزمة com.zadelkhair.app واسم التطبيق
          sed -i 's/applicationId "[^"]*"/applicationId "com.zadelkhair.app"/' $APP_GRADLE
          sed -i 's/namespace "[^"]*"/namespace "com.zadelkhair.app"/' $APP_GRADLE
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">زاد الخير<\/string>/' $STRINGS

          # ثانياً: حقن ملف خدمات جوجل (Firebase) للهوية المعرّفة
          cat <<EOF > android/app/google-services.json
          {
            "project_info": {
              "project_number": "162488255991",
              "project_id": "mamoul-app",
              "storage_bucket": "mamoul-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:162488255991:android:73d6299f11a1b7aec61af2",
                  "android_client_info": { "package_name": "com.zadelkhair.app" }
                },
                "api_key": [ { "current_key": "AIzaSyAKjsgnoHnGGr3urhm6Kpu7RvxN2dp6sJQ" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          # ثالثاً: إدراج الأذونات القياسية المطلوبة في نظام أندرويد بشكل احترافي وسليم
          sed -i '/<manifest[^>]*>/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' $MANIFEST

      - name: 8. Core Native Icon Generation (Bypassing capacitor-assets)
        run: |
          # تنظيف كامل لكافة مجلدات ومحتويات الـ mipmap التالفة لتهيئة أندرويد من الصفر
          rm -rf android/app/src/main/res/mipmap*
          
          # تجهيز أيقونة المصدر الأساسية (إذا لم تكن موجودة يتم توليد واحدة بلون أخضر ناصع)
          BASE_SRC="base_icon.png"
          if [ -f "resources/icon-foreground.png" ]; then
            convert "resources/icon-foreground.png" -resize 512x512 png24:$BASE_SRC
          elif [ -f "resources/icon.png" ]; then
            convert "resources/icon.png" -resize 512x512 png24:$BASE_SRC
          else
            convert -size 512x512 xc:#2ecc71 png24:$BASE_SRC
          fi
          
          # مصفوفة مجلدات الأندرويد القياسية للمقاسات والمقاس المقابل لها بالبكسل
          declare -A RESOLUTIONS=( ["mipmap-ldpi"]="36x36" ["mipmap-mdpi"]="48x48" ["mipmap-hdpi"]="72x72" ["mipmap-xhdpi"]="96x96" ["mipmap-xxhdpi"]="144x144" ["mipmap-xxxhdpi"]="192x192" )
          
          # توليد الأيقونات الكلاسيكية والأيقونات الأمامية التكيفية بشكل خام مباشر متوافق 100% مع AAPT2
          for DIR in "${!RESOLUTIONS[@]}"; do
            TARGET_DIR="android/app/src/main/res/$DIR"
            mkdir -p "$TARGET_DIR"
            SIZE="${RESOLUTIONS[$DIR]}"
            
            # توليد الأيقونة القياسية
            convert $BASE_SRC -resize $SIZE png24:"$TARGET_DIR/ic_launcher.png"
            # توليد الأيقونة الدائرية
            convert $BASE_SRC -resize $SIZE png24:"$TARGET_DIR/ic_launcher_round.png"
            # توليد أيقونة المقدمة (المسؤولة عن الخطأ السابق) لتعمل بشكل سليم تماماً
            convert $BASE_SRC -resize $SIZE png24:"$TARGET_DIR/ic_launcher_foreground.png"
          done

      - name: 9. Build Production Binaries (Gradle Execution)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: 10. Securely Sign APK & AAB
        run: |
          # توليد مفتاح التشفير الخاص بالنشر للنسخة النهائية
          keytool -genkey -v -keystore zadelkhair.jks -alias zadelkhair_alias -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "mamoul_pass_2026" -keypass "mamoul_pass_2026" \
            -dname "CN=ZadElkhairApp, OU=Production, O=ZadElkhair, L=Cairo, C=EG"
          
          # توقيع وتجهيز ملف الـ APK
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner sign --ks zadelkhair.jks \
            --ks-pass pass:"mamoul_pass_2026" --out ZadElkhair-Final.apk "$APK_PATH"
          
          # توقيع وتجهيز ملف الـ AAB المخصص للمتجر
          AAB_PATH=$(find android/app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          jarsigner -keystore zadelkhair.jks -storepass "mamoul_pass_2026" "$AAB_PATH" zadelkhair_alias
          cp "$AAB_PATH" ZadElkhair-Final.aab

      - name: 11. Publish Assets to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Zad Elkhair Production Build v${{ github.run_number }}"
          draft: false
          prerelease: false
          files: |
            ZadElkhair-Final.apk
            ZadElkhair-Final.aab
            zadelkhair.jks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
