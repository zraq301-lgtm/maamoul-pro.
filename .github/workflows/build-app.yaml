name: "Mamoul Production Build"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Environment (Java & Node)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # تسرع عملية بناء أندرويد لاحقاً

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # يتم تفعيل الكاش هنا بشكل آمن

      - name: 3. Install Dependencies
        run: |
          npm install --legacy-peer-deps
          # تثبيت الأدوات الأساسية عالمياً لضمان توفر المسارات
          npm install -g @capacitor/cli @capacitor/assets

      - name: 4. Web Build
        run: |
          npm run build
          # التأكد من وجود مجلد التوزيع بعد البناء
          mkdir -p www
          cp -r dist/* www/ || echo "Using existing www content"

      - name: 5. Android Preparation & Native Sync
        run: |
          # إضافة المنصة فقط إذا لم تكن موجودة
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # حقن ملف Firebase بشكل نظيف
          mkdir -p android/app/
          echo '${{ secrets.FIREBASE_CONFIG_JSON }}' > android/app/google-services.json
          
          # مزامنة الكود
          npx cap sync android

      - name: 6. Configure Android Identity
        shell: bash
        run: |
          # استخدام متغيرات واضحة بدلاً من التعديل المباشر الصعب تتبعه
          sed -i 's/namespace .*/namespace "com.mamoul.app"/' android/app/build.gradle
          sed -i 's/applicationId .*/applicationId "com.mamoul.app"/' android/app/build.gradle
          
          # تحديث اسم التطبيق في القيم
          STRINGS="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">معمول<\/string>/' $STRINGS
          fi

      - name: 7. Resource Generation
        run: |
          # توليد الأيقونات فقط إذا وجدت المجلدات الأساسية
          npx capacitor-assets generate --android || echo "Assets generation skipped: Missing source files"

      - name: 8. Build Android Release
        working-directory: ./android
        run: |
          chmod +x gradlew
          # حل مشكلة تضارب المكتبات عبر init script أو تعديل مباشر آمن
          echo "configurations.all { resolutionStrategy.eachDependency { details -> if (details.requested.name == 'bcprov-jdk18on') { details.useVersion '1.78.1' } } }" >> build.gradle
          ./gradlew assembleRelease --no-daemon

      - name: 9. Sign APK
        id: sign_app
        run: |
          # ملاحظة: يفضل استخدام secrets لملف الـ Keystore، لكن سنبقي طريقتك مع تحسينها
          keytool -genkey -v -keystore mamoul.jks -alias mamoul_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass "mamoul_pass_2026" -keypass "mamoul_pass_2026" -dname "CN=MamoulApp, O=Mamoul, C=EG" -noprompt
          
          # العثور على APK المجمع
          RAW_APK=$(find android/app/build/outputs/apk/release/ -name "app-release-unsigned.apk" -o -name "*.apk" | head -n 1)
          
          # استخدام apksigner المدمج في النظام
          BUILD_TOOLS_VERSION=$(ls $ANDROID_HOME/build-tools | tail -n 1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner sign --ks mamoul.jks --ks-pass pass:"mamoul_pass_2026" --out Mamoul-Final.apk "$RAW_APK"

      - name: 10. Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Mamoul Release v1.0.${{ github.run_number }}"
          body: |
            التحديث التلقائي لمنصة معمول.
            رقم البناء: ${{ github.run_number }}
            تاريخ البناء: ${{ github.event.head_commit.timestamp }}
          files: Mamoul-Final.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
