name: "Mamoul Production Build"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' 

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20' # إصدار 20 هو الأكثر استقراراً لـ Vite 6 و Capacitor حالياً
          cache: 'npm'

      - name: 4. Install Dependencies & Build Web
        run: |
          # تنظيف البيئة لضمان عدم وجود ملفات تالفة
          rm -rf node_modules package-lock.json dist www
          npm install --legacy-peer-deps
          # بناء نسخة الويب أولاً
          npm run build

      - name: 5. Capacitor Preparation
        run: |
          # التأكد من وجود مجلد www قبل محاولة الربط مع أندرويد
          mkdir -p www
          # تركيب Capacitor CLI محلياً لضمان وجود الـ Executable
          npm install @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps
          
          # إضافة منصة أندرويد إذا لم تكن موجودة
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # مزامنة الملفات من www إلى مجلد أندرويد
          npx cap copy android
          npx cap sync android

      - name: 6. Inject Firebase & App Identity
        shell: bash
        run: |
          # حقن ملف جوجل سيرفس في المسار الصحيح
          mkdir -p android/app/
          cat <<EOF > android/app/google-services.json
          {
            "project_info": { "project_number": "162488255991", "project_id": "mamoul-app" },
            "client": [ { "client_info": { "mobilesdk_app_id": "1:162488255991:android:73d6299f11a1b7aec61af2", "android_client_info": { "package_name": "com.mamoul.app" } }, "api_key": [ { "current_key": "AIzaSyAKjsgnoHnGGr3urhm6Kpu7RvxN2dp6sJQ" } ], "services": { "appinvite_service": { "other_platform_oauth_client": [] } } } ],
            "configuration_version": "1"
          }
          EOF

          # تعديل هوية التطبيق (الاسم وحزمة الحماية)
          STRINGS="android/app/src/main/res/values/strings.xml"
          APP_GRADLE="android/app/build.gradle"
          
          if [ -f "$STRINGS" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">معمول<\/string>/' $STRINGS
          fi
          
          sed -i 's/namespace ".*"/namespace "com.mamoul.app"/' $APP_GRADLE
          sed -i 's/applicationId ".*"/applicationId "com.mamoul.app"/' $APP_GRADLE

      - name: 7. Generate Icons & Assets
        run: |
          npm install @capacitor/assets --save-dev --legacy-peer-deps
          # التأكد من وجود أيقونة المصدر قبل التوليد (افترض وجودها في resources/icon.png)
          # إذا لم تكن موجودة سيتجاوز الخطوة لتجنب الانهيار
          npx capacitor-assets generate --android || echo "Icons generation skipped - source not found"

      - name: 8. Fix Dependencies & Native Build
        run: |
          cd android
          chmod +x gradlew
          
          # حل مشكلة مكتبة bcprov وإجبار Gradle على النسخة المستقرة
          echo "configurations.all { resolutionStrategy.eachDependency { details -> if (details.requested.name == 'bcprov-jdk18on') { details.useVersion '1.78.1' } } }" >> build.gradle
          
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon --no-build-cache

      - name: 9. Sign APK
        run: |
          # إنشاء مفتاح التوقيع
          keytool -genkey -v -keystore mamoul.jks -alias mamoul_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass "mamoul_pass_2026" -keypass "mamoul_pass_2026" -dname "CN=MamoulApp, O=Mamoul, C=EG"
          
          # البحث عن أداة التوقيع والـ APK
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          # التوقيع النهائي
          $APKSIGNER sign --ks mamoul.jks --ks-pass pass:"mamoul_pass_2026" --out Mamoul-Final.apk "$APK_PATH"

      - name: 10. Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Mamoul Release v1.0.${{ github.run_number }}"
          files: Mamoul-Final.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
