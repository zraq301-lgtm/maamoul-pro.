name: "Mamoul Production Build"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' 

      - name: 3. Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 4. Deep Clean & Install
        run: |
          rm -rf node_modules package-lock.json android ios dist_web
          npm install --legacy-peer-deps
          npm run build

      - name: 5. Initialize Android (Fresh Start)
        run: |
          mkdir -p www
          npx cap add android
          npx cap sync android

      - name: 6. Inject Firebase & App Identity
        shell: bash
        run: |
          # حقن ملف جوجل سيرفس
          cat <<EOF > android/app/google-services.json
          {
            "project_info": { "project_number": "162488255991", "project_id": "mamoul-app" },
            "client": [ { "client_info": { "mobilesdk_app_id": "1:162488255991:android:73d6299f11a1b7aec61af2", "android_client_info": { "package_name": "com.mamoul.app" } }, "api_key": [ { "current_key": "AIzaSyAKjsgnoHnGGr3urhm6Kpu7RvxN2dp6sJQ" } ], "services": { "appinvite_service": { "other_platform_oauth_client": [] } } } ],
            "configuration_version": "1"
          }
          EOF

          # تعديل الهوية
          STRINGS="android/app/src/main/res/values/strings.xml"
          APP_GRADLE="android/app/build.gradle"
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">معمول<\/string>/' $STRINGS
          sed -i 's/namespace ".*"/namespace "com.mamoul.app"/' $APP_GRADLE
          sed -i 's/applicationId ".*"/applicationId "com.mamoul.app"/' $APP_GRADLE

      - name: 7. Generate Icons
        run: |
          npm install @capacitor/assets --save-dev --legacy-peer-deps
          npx capacitor-assets generate --android

      - name: 8. Fix Dependencies & Build
        run: |
          cd android
          chmod +x gradlew
          
          # إجبار Gradle على استبدال المكتبة التالفة بنسخة سليمة (هذا هو الحل الحقيقي)
          echo "configurations.all { resolutionStrategy.eachDependency { details -> if (details.requested.name == 'bcprov-jdk18on') { details.useVersion '1.78.1' } } }" >> build.gradle
          
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon --no-build-cache -Dorg.gradle.java.home=$JAVA_HOME

      - name: 9. Sign & Publish
        run: |
          keytool -genkey -v -keystore mamoul.jks -alias mamoul_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass "mamoul_pass_2026" -keypass "mamoul_pass_2026" -dname "CN=MamoulApp, O=Mamoul, C=EG"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          $APKSIGNER sign --ks mamoul.jks --ks-pass pass:"mamoul_pass_2026" --out Mamoul-Final.apk "$APK_PATH"

      - name: 10. Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: Mamoul-Final.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
