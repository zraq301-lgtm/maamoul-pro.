name: "Zad Elkhair Production Build"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 4. Deep Clean & Install Dependencies
        run: |
          # حذف أي رواسب قد تتسبب في تعارض البناء السحابي لضمان الصفر المطلق
          rm -rf node_modules package-lock.json android ios dist dist_web build
          
          # تثبيت الاعتمادات الأساسية للمشروع
          npm install --legacy-peer-deps
          
          # تثبيت الإضافات اللازمة للـ SQLite والإشعارات وضمان استقرارها سحابياً
          npm install @capacitor/local-notifications @capacitor-community/sqlite @capacitor/preferences --save --legacy-peer-deps
          
          # بناء ملفات الويب الثابتة للمشروع (إنتاج مجلد الـ build أو dist المذكور في capacitor.config)
          npm run build

      - name: 5. Initialize Android (Fresh & Independent Start)
        run: |
          # إضافة منصة أندرويد خام من الصفر
          npx cap add android
          
          # مزامنة ملفات الويب والإضافات داخل مجلد الأندرويد الجديد
          npx cap sync android

      - name: 6. Inject Configurations, Firebase & Advanced Fixes
        shell: bash
        run: |
          STRINGS="android/app/src/main/res/values/strings.xml"
          APP_GRADLE="android/app/build.gradle"
          ROOT_GRADLE="android/build.gradle"
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          # أولاً: إعادة ضبط معرّف الحزمة (Package Name / Application ID) واسم التطبيق بشكل صارم واحترافي
          sed -i 's/applicationId "[^"]*"/applicationId "com.zadelkhair.app"/' $APP_GRADLE
          sed -i 's/namespace "[^"]*"/namespace "com.zadelkhair.app"/' $APP_GRADLE
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">زاد الخير<\/string>/' $STRINGS

          # ثانياً: حل مشكلة تعارض الـ Jar الخاصة بـ bcprov ومكتبات التشفير لـ SQLite في الخوادم
          cat << 'EOF' >> $ROOT_GRADLE
          subprojects {
              project.configurations.all {
                  resolutionStrategy {
                      eachDependency { details ->
                          if (details.requested.group == 'org.bouncycastle') {
                              details.useVersion '1.70'
                          }
                      }
                  }
              }
          }
          EOF

          # ثالثاً: حقن ملف Firebase (google-services.json) بالبيانات المحدثة للحزمة الجديدة
          cat <<EOF > android/app/google-services.json
          {
            "project_info": {
              "project_number": "162488255991",
              "project_id": "mamoul-app",
              "storage_bucket": "mamoul-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:162488255991:android:73d6299f11a1b7aec61af2",
                  "android_client_info": { "package_name": "com.zadelkhair.app" }
                },
                "api_key": [ { "current_key": "AIzaSyAKjsgnoHnGGr3urhm6Kpu7RvxN2dp6sJQ" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          # رابعاً: حقن أذونات نظام أندرويد المطلوبة للإنترنت، الشبكة، والإشعارات الدقيقة في الـ Manifest
          # نستخدم أسلوب الصفر المطلق عبر استبدال وسم الـ manifest لإدراج الأذونات بشكل سليم ومثالي
          sed -i '/<manifest[^>]*>/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' $MANIFEST

      - name: 7. Generate App Icons & Splash Assets
        run: |
          # إنشاء الأيقونات بشكل ديناميكي كامل دون افتراض وجود ملفات مسبقة في مجلدات الأندرويد
          mkdir -p assets
          if [ -f "resources/icon-foreground.png" ]; then
            cp resources/icon-foreground.png assets/icon-only.png
            cp resources/icon-foreground.png assets/icon.png
          elif [ -f "icon-only.png" ]; then
            cp icon-only.png assets/icon-only.png
            cp icon-only.png assets/icon.png
          else
            # إنشاء أيقونة طوارئ فارغة إذا لم يجد السيرفر أي ملفات لمنع توقف البناء
            convert -size 512x512 xc:blue assets/icon.png || touch assets/icon.png
            cp assets/icon.png assets/icon-only.png
          fi
          npx capacitor-assets generate --android

      - name: 8. Build Production Binaries (Gradle Execution)
        run: |
          cd android
          chmod +x gradlew
          # تنظيف بيئة الجرادل ثم تجميع الـ APK والـ AAB لنسخة الـ Release
          ./gradlew clean
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: 9. Securely Sign APK & AAB
        run: |
          # إنشاء Keystore فريدة ومستقلة أثناء خطوة البناء مباشرة للتشفير والامضاء
          keytool -genkey -v -keystore zadelkhair.jks -alias zadelkhair_alias -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "mamoul_pass_2026" -keypass "mamoul_pass_2026" \
            -dname "CN=ZadElkhairApp, OU=Production, O=ZadElkhair, L=Cairo, C=EG"
          
          # البحث عن ملف الـ APK وتوقيعه بأدوات أندرويد الرسمية المتوفرة على السيرفر
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner sign --ks zadelkhair.jks \
            --ks-pass pass:"mamoul_pass_2026" --out ZadElkhair-Final.apk "$APK_PATH"
          
          # البحث عن ملف الـ AAB (المخصص لمتجر جوجل بلاي) وتوقيعه بنجاح
          AAB_PATH=$(find android/app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          jarsigner -keystore zadelkhair.jks -storepass "mamoul_pass_2026" "$AAB_PATH" zadelkhair_alias
          cp "$AAB_PATH" ZadElkhair-Final.aab

      - name: 10. Publish Assets to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Zad Elkhair Production Build v${{ github.run_number }}"
          draft: false
          prerelease: false
          files: |
            ZadElkhair-Final.apk
            ZadElkhair-Final.aab
            zadelkhair.jks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
